name: MSBuild

on:
  push:
    branches: [ "ci" ]
  pull_request:
    branches: [ "ci" ]

env:
  DEVENV_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE
  DEVENV_PATH2: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\devenv.com
  QT_VERSION: 6.6.1
  QT_PATH: ${{ github.workspace }}/qt/Qt/${{ env.QT_VERSION }}/msvc2019_64
  QT_MSBUILD: ${{ github.workspace }}/qt/Qt/${{ env.QT_VERSION }}/msvc2019_64

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Step 1: Check out the main project repository
    - name: Check out the main project repository
      uses: actions/checkout@v2
      with:
        repository: OT-OpenTwin/OpenTwin
        ref: Ci
        path: OpenTwin

    # Step 2: Install Rust 1.76.0
    - name: Install Rust 1.76.0
      run: |
        choco install rust --version=1.76.0 -y
      shell: cmd

    # Step 3: Install Qt using install-qt-action
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_msvc2019_64
        dir: ${{ github.workspace }}/qt
        install-deps: true

    - name: Add Visual Studio to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    # Step 4: Set Qt path and refresh environment
    - name: Set Qt path and refresh
      run: |
        echo "${{ github.workspace }}/qt/Qt/${{ env.QT_VERSION }}/msvc2019_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        refreshenv

    # Step 5: Check availability of Qt libraries
    - name: Check availability of Qt libraries
      run: |
        dir ${{ github.workspace }}\qt\Qt\${{ env.QT_VERSION }}\msvc2019_64\lib
      shell: cmd

    # Step 6: Check availability of Qt binaries
    - name: Check availability of Qt binaries
      run: |
        dir ${{ github.workspace }}\qt\Qt\${{ env.QT_VERSION }}\msvc2019_64\bin
      shell: cmd

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14' # specify the version you need

    - name: Install Yarn
      run: npm install -g yarn

    - name: Install dependencies
      run: yarn install

    # Step 7: Install Python and Sphinx
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install Sphinx and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme

    # Step 8: Setup and Execute Build with devenv
    - name: Setup and Execute Build
      shell: cmd
      run: |
        echo "Current directory: %cd%"
        set OPENTWIN_DEV_ROOT=%cd%\OpenTwin
        set DEVENV_ROOT_2022=%DEVENV_PATH%
        set QT_ROOT_DIR=${{ github.workspace }}\qt\Qt\${{ env.QT_VERSION }}\msvc2019_64
        set PATH=%QT_ROOT_DIR%\bin;%PATH%
        set QTDIR=%QT_ROOT_DIR%
        set QMAKESPEC=win32-msvc
        set QT_PLUGIN_PATH=%QT_ROOT_DIR%\plugins
        echo "OPENTWIN_DEV_ROOT=%OPENTWIN_DEV_ROOT%"
        echo "DEVENV_ROOT_2022=%DEVENV_ROOT_2022%"
        echo "Checking directories and necessary files..."
        echo "OpenTwin directory: %OPENTWIN_DEV_ROOT%"
        dir %OPENTWIN_DEV_ROOT%
        echo "Visual Studio 2022 directory: %DEVENV_ROOT_2022%"
        dir "%DEVENV_ROOT_2022%"
        echo "Qt directory: %QT_ROOT_DIR%"
        dir "%QT_ROOT_DIR%"
        echo "Checking if BuildAll.bat exists..."
        echo "Starting BuildAll.bat..."
        "%DEVENV_ROOT_2022%\devenv.com" "%OPENTWIN_DEV_ROOT%\Libraries\OTWidgets\OTWidgets.vcxproj" /build "Debug|x64"

        echo "All checks passed."

    # Step 9: Debug - Check Environment Variables
    - name: Debug - Check Environment Variables
      run: |
        echo "QT_PATH: %QT_PATH%"
        echo "QT_MSBUILD: %QT_MSBUILD%"
        dir %QT_PATH%
        dir %QT_MSBUILD%
      shell: cmd
